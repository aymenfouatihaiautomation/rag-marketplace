<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ShopAI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; }

    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      padding: 20px;
      animation: fadeUp 0.4s ease both;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2rem;
      letter-spacing: -0.04em;
      color: var(--text);
    }
    .login-logo h1 span { color: var(--accent); }
    .login-logo p {
      margin-top: 6px;
      color: var(--text-sub);
      font-size: 0.88rem;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: var(--shadow), 0 0 80px #4f7cff0a;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 7px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .btn-login {
      width: 100%;
      justify-content: center;
      padding: 13px;
      font-size: 0.95rem;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-top: 8px;
      border-radius: var(--radius-sm);
    }

    .error-msg {
      background: #ff4f6a18;
      border: 1px solid #ff4f6a44;
      color: var(--red);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.83rem;
      margin-top: 14px;
      display: none;
    }

    /* accent glow bg */
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, #4f7cff12, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <h1>Shop<span>AI</span></h1>
      <p>Your intelligent commerce platform</p>
    </div>

    <div class="login-card">
      <div class="field">
        <label>Username</label>
        <input id="username" class="input" type="text" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" class="input" type="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary btn-login" id="login-btn" onclick="doLogin()">
        Sign In
      </button>

      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/js/utils.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.token()) window.location.href = '/dashboard.html';

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('error-msg');

      if (!username || !password) {
        showError('Please fill in all fields.');
        return;
      }

      btn.textContent = 'Signing in…';
      btn.disabled    = true;
      errEl.style.display = 'none';

      try {
        const res = await fetch('/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || 'Login failed.');
          btn.textContent = 'Sign In';
          btn.disabled    = false;
          return;
        }

        Auth.save(data.token, data.user_id, data.username);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showError('Connection error. Is the server running?');
        btn.textContent = 'Sign In';
        btn.disabled    = false;
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent    = msg;
      el.style.display  = 'block';
    }
  </script>
</body>
</html>
